name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - run: node --test tests/dictation.test.cjs
      - run: bash -n bin/install vendor/granola-linux
      - run: python3 -m py_compile bin/omarchy-granola bin/patch-voice-typing bin/granola-voice-key bin/install-voice-shortcut
